name: CI

on:
  push:
    branches:
      - lms-d2d
  pull_request:
    branches:
      - lms-d2d

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is pinned via the "packageManager" field in package.json; do not
        # also set it here, or pnpm/action-setup fails with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Run deterministic tests
        # The live Supabase connectivity probe requires pilot credentials and is not a CI unit test.
        run: pnpm exec vitest run --exclude '**/supabase.connection.test.ts'

      - name: Build production bundles
        run: pnpm build
